[package]
name = "knockbox"
version = "0.2.13"
description = "叩叩 — 轻量跨平台启动器"
authors = ["knockbox"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "knockbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
# 这三个是**跨平台**依赖，别放进下面的 macOS 分组：
#   walkdir —— core/files.rs 的目录遍历兜底（Windows 没装 Everything 时全靠它）
#   zip     —— plugins/source.rs 解包安装插件
#   sha2    —— plugins/source.rs 的完整性校验
# 曾被错放进 macOS 分组 → Windows 编译时 E0432/E0433 "找不到 crate"
walkdir = "2"
sha2 = "0.10"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

# 截图覆盖层要把窗口 level 抬到菜单栏之上（不然屏幕顶部一条永远选不中），
# 只能拿 NSWindow 句柄自己 setLevel:。objc 是纯 FFI 宏，零构建成本。
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
