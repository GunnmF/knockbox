name: ci

# 推 master / PR 时只做「能不能编译 + 单测过不过」，不碰 Release、不碰签名私钥。
#
# 为什么要单独一个 workflow：release.yml 是打 tag 才跑的，而跨平台编译错误
# （`RunEvent::Reopen` 只在 macOS 有、依赖被错放进 macOS 分组这类）**只有
# Windows 编译时才会暴露**。在 tag 上第一次发现，代价是一整轮失败的发布。
# 这里用 `tauri build --no-bundle` 走和发布完全相同的构建链路，只是不产出安装包。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # 只读代码，不给任何写权限

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false # 两端都要跑完，才知道是「只有 Windows 挂」还是「都挂」
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
          - name: Windows (x64)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: 类型检查
        run: pnpm tsc --noEmit

      - name: 编译（与发版同一条链路，但不打包）
        run: pnpm tauri build --no-bundle

      - name: 单元测试
        run: cargo test
