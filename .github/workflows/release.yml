name: release

# 打 tag 即发版：mac + Windows 都在 CI 里编译并**签名**，自动上传到 Release。
#
# 为什么签名也放 CI：为了让发版只有「推 tag」一步。私钥存在 GitHub Actions
# Secret 里（KNOCKBOX_UPDATER_KEY），值加密存储、界面上不显示。
# 代价与配套：secret 会在运行时注入环境变量，所以本 workflow 的第三方 action
# **全部锁到 commit SHA**（不用 @v4 这种可被重新指向的 tag），权限压到最小
# （只要 contents:write）。改动本 workflow 等同于交出私钥，review 时留意。
#
# 一次性准备（见 docs/HANDOVER.md §3.7）：
#   Settings → Secrets and variables → Actions → New repository secret
#   KNOCKBOX_UPDATER_KEY = ~/.tauri/knockbox.key 的**文件内容**
#   （终端里 pbcopy < ~/.tauri/knockbox.key 直接复制）
#
# 流程：
#   pnpm release            # 升版本 + 本机自测构建
#   git commit -am v0.2.x && git tag v0.2.x && git push --tags
#   → 本 workflow 编包 + 签名 + 上传 + 生成 update.json，全自动
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 Release / 上传附件，除此之外一律不给

env:
  # Secret 不存在时为空字符串，正好对应"私钥无密码"
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KNOCKBOX_UPDATER_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KNOCKBOX_UPDATER_KEY_PASSWORD }}

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: 校验 tag 与版本号一致（手动触发时跳过）
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag=$TAG version=$VER"
            if [ "$TAG" != "$VER" ]; then echo "::error::tag 与 package.json 版本不一致"; exit 1; fi
          else
            echo "手动触发：用 package.json 的版本 v$VER"
          fi

      - name: 构建（updater 产物由 tauri 用私钥直接签好）
        run: pnpm tauri build

      - id: publish
        name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # tag 一律取自 package.json 的版本号：手动触发时 GITHUB_REF_NAME
          # 是分支名（master），拿它当 tag 会建出一个叫 master 的 release
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          # 注意产物是分目录的，别把 dmg 也在 macos/ 里找：
          #   bundle/macos/  → *.app、*.app.tar.gz（+ .sig，updater 实际用的）
          #   bundle/dmg/    → *.dmg（给人手动下载的）
          B=src-tauri/target/release/bundle
          ls "$B"/macos/*.app.tar.gz "$B"/macos/*.app.tar.gz.sig >/dev/null \
            || { echo "::error::没找到 updater 产物，确认 createUpdaterArtifacts 和签名私钥"; exit 1; }
          TARBALL=$(cd "$B/macos" && ls *.app.tar.gz)
          DMGS=$(cd "$B/dmg" && ls *.dmg)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$B/macos/$TARBALL" "$B/macos/$TARBALL.sig" $DMGS --clobber
          {
            echo "asset=$TARBALL"
            echo "signature=$(cat "$B/macos/$TARBALL.sig")"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: 构建
        run: pnpm tauri build

      - id: publish
        name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v" + (Get-Content package.json | ConvertFrom-Json).version
          $root = "src-tauri/target/release/bundle"
          # NSIS 的 exe.zip 才是 Windows updater 认的产物
          $zip = (Get-ChildItem "$root/nsis/*.zip" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike "*.sig" } | Select-Object -First 1)
          if (-not $zip) { throw "没有找到 $root/nsis/*.zip，确认 createUpdaterArtifacts 与签名私钥" }
          if (-not (Test-Path "$($zip.FullName).sig")) { throw "缺少签名文件 $($zip.Name).sig" }
          # 只传实际存在的产物：msi.zip 不一定会生成（Windows 更新只用 NSIS 的 zip），
          # 写死路径传不存在的文件会让 gh 直接报错
          $files = @(Get-ChildItem "$root/nsis/*.exe", "$root/nsis/*.zip", "$root/nsis/*.zip.sig", "$root/msi/*.msi", "$root/msi/*.zip", "$root/msi/*.zip.sig" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          gh release view $tag *> $null; if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --generate-notes }
          gh release upload $tag @files --clobber
          "asset=$($zip.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signature=$((Get-Content "$($zip.FullName).sig" -Raw).Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  publish-update-json:
    name: 生成 update.json
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: 组装并上传 update.json（客户端只认这一个文件）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.macos.outputs.version }}
          MAC_ASSET: ${{ needs.macos.outputs.publish.asset }}
          MAC_SIG: ${{ needs.macos.outputs.publish.signature }}
          WIN_ASSET: ${{ needs.windows.outputs.publish.asset }}
          WIN_SIG: ${{ needs.windows.outputs.publish.signature }}
        run: node scripts/ci-publish-update-json.mjs
