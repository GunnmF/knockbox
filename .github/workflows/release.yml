name: release

# 推 master 即发版：mac + Windows 都在 CI 里编译并**签名**，自动上传到 Release。
#
# 分支约定：平时在 dev 上开发，只有要出新版时才合并到 master。所以「推 master」
# 等于「我要发版」，不需要再单独打 tag —— tag 由本 workflow 在构建时创建，
# 指向被编译的那个 commit（本地打 tag 反而容易出现 tag 和实际构建的代码对不上）。
#
# 版本号来自 master 上 package.json 的 version，所以合并前必须先升版本：
#   git switch dev && pnpm release:publish   # 升版本 + 提交
#   git switch master && git merge dev && git push origin master
#   → 本 workflow 编包 + 签名 + 上传 + 建 tag + 生成 update.json，全自动
#
# 为什么签名也放 CI：为了让发版只有「合并到 master」一步。私钥存在 GitHub
# Actions Secret 里（KNOCKBOX_UPDATER_KEY），值加密存储、界面上不显示。
# 代价与配套：secret 会在运行时注入环境变量，所以本 workflow 的第三方 action
# **全部锁到 commit SHA**（不用 @v4 这种可被重新指向的 tag），权限压到最小
# （只要 contents:write）。改动本 workflow 等同于交出私钥，review 时留意。
#
# 一次性准备（见 docs/HANDOVER.md §3.7）：
#   Settings → Secrets and variables → Actions → New repository secret
#   KNOCKBOX_UPDATER_KEY = ~/.tauri/knockbox.key 的**文件内容**
#   （终端里 pbcopy < ~/.tauri/knockbox.key 直接复制）
on:
  push:
    branches: [master]
  workflow_dispatch: # 手动触发时用 master 的 HEAD 重新发一次当前版本

permissions:
  contents: write # 创建 Release / 上传附件，除此之外一律不给

jobs:
  prepare:
    name: 准备
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: check
        name: 判断这次要不要真的发
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # 推 master 未必都是发版（偶尔推个文档修正）。这个版本的 release
          # 已经完整（update.json 也在）就跳过，省掉一次 5 分钟构建。
          # 故意只看 update.json：上次发版中途挂了的话它不在，会重跑并补齐，
          # 等于自带修复能力
          NAMES=$(gh release view "v$VER" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$NAMES" | grep -qx update.json; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VER 已经发过了（update.json 在），本次跳过构建"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "准备发 v$VER"
          fi

  macos:
    name: macOS (Apple Silicon)
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-14
    # 私钥只给真正要用它的两个构建 job，第三个 job（生成 update.json）用不到
    # Secret 不存在时为空字符串，正好对应"私钥无密码"
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KNOCKBOX_UPDATER_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KNOCKBOX_UPDATER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: 构建（updater 产物由 tauri 用私钥直接签好）
        run: pnpm tauri build

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.prepare.outputs.version }}"
          # 产物是分目录的：
          #   bundle/macos/  → *.app、*.app.tar.gz（+ .sig）← updater 实际用的
          #   bundle/dmg/    → *.dmg（给人手动下载的）
          # 路径必须一路带目录：写成 $(cd "$B/dmg" && ls *.dmg) 的话 cd 之后的
          # 相对路径只剩文件名，传给 gh 时按工作目录解析的，找不到文件
          B=src-tauri/target/release/bundle
          TARBALL=$(ls "$B"/macos/*.app.tar.gz)
          if [ ! -f "$TARBALL" ] || [ ! -f "$TARBALL.sig" ]; then
            echo "::error::没找到 $TARBALL 或它的 .sig，确认 createUpdaterArtifacts 和签名私钥"
            exit 1
          fi
          DMGS=$(ls "$B"/dmg/*.dmg 2>/dev/null || true)
          # --target 让 tag 精确落在被构建的这个 commit 上：master 后面还会继续
          # 往前走，用默认分支 HEAD 建 tag 会标到没构建过的代码上
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sig" $DMGS --clobber
          # 不写 GITHUB_OUTPUT：下游那个 job 会自己去 Release 上找产物和签名

  windows:
    name: Windows (x64)
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KNOCKBOX_UPDATER_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KNOCKBOX_UPDATER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: 构建
        run: pnpm tauri build

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v${{ needs.prepare.outputs.version }}"
          $root = "src-tauri/target/release/bundle"
          # Windows 的 updater 产物就是 **NSIS 安装器 exe 本身 + .exe.sig**，
          # 没有 zip（Tauri v1 才是 .nsis.zip，v2 去掉了）。找 *.zip 永远找不到。
          $exe = Get-ChildItem "$root/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "没有找到 $root/nsis/*.exe，确认打包与 createUpdaterArtifacts" }
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "缺少签名文件 $($exe.Name).sig" }
          # 只传实际存在的产物：msi 是给人手动装的，Windows 自动更新只用 nsis 那个
          $files = @(Get-ChildItem "$root/nsis/*.exe", "$root/nsis/*.exe.sig", "$root/msi/*.msi", "$root/msi/*.msi.sig" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          # `gh release view` 对不存在的 tag 会往 stderr 写并返回非 0。PowerShell 7.3+
          # 在 $ErrorActionPreference=Stop 下会把原生命令的 stderr 抛成终止性错误，
          # 这里用 try 包一层，只认 $LASTEXITCODE
          try { gh release view $tag *> $null } catch { }
          # --target 让 tag 精确落在被构建的这个 commit 上
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --target "$env:GITHUB_SHA" --generate-notes }
          gh release upload $tag @files --clobber
          # 同上：不写 GITHUB_OUTPUT

  publish-update-json:
    name: 生成 update.json
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # 产物名和签名不去上游取：脚本自己读 Release 上已上传的资产自己找
      # （mac 的 *.app.tar.gz + .sig、win 的 *x64-setup.exe + .exe.sig）。
      # 跨 job 传 needs.*.outputs 这条链路整条失效过一次，且失败时看不出是谁的问题
      - name: 组装并上传 update.json（客户端只认这一个文件）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: node scripts/ci-publish-update-json.mjs
